<div class="hold-transition sidebar-mini layout-fixed" style="background-color: var(--cr-bg-page) !important;">
  <div class="wrapper" style="background-color: var(--cr-bg-page) !important; min-height: 100vh;">

    <app-header></app-header>
    <app-sidebar></app-sidebar>

    <!-- Content Wrapper con fondo lino y cálido -->
    <div class="content-wrapper" style="background-color: var(--cr-bg-page) !important; min-height: calc(100vh - 120px);">
      <!-- Contenedor principal con espaciado amplio -->
      <div class="container-fluid py-4 px-4">
        <router-outlet></router-outlet>
      </div>
    </div>

    <app-footer></app-footer>

    <!-- Control Sidebar -->
    <aside class="control-sidebar control-sidebar-dark" style="background-color: var(--cr-primary-dark) !important;">
    </aside>
  </div>

  <!-- Chatbot componente -->
  <app-chatbot *ngIf="authService.isAuth()"></app-chatbot>
</div>
