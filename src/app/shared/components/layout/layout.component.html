<body class="hold-transition sidebar-mini layout-fixed"
  style="background: #2c3e50 !important; font-family: 'Poppins', sans-serif;">

  <div class="wrapper" style="background: #2c3e50 !important;">
    <!-- Eliminamos el fondo sutil que podría estar interfiriendo -->

    <app-header></app-header>
    <app-sidebar></app-sidebar>

    <!-- Content Wrapper con fondo distintivamente más oscuro -->
    <div class="content-wrapper shadow-sm"
      style="background: #34495e !important; border-left: 1px solid rgba(255,255,255,0.1) !important; color: #ecf0f1 !important;">

      <!-- Decoración más visible -->
      <div class="position-absolute"
        style="top: 0; left: 0; width: 100%; height: 4px; background: linear-gradient(90deg, #e74c3c 0%, #f1c40f 50%, #e74c3c 100%) !important;">
      </div>

      <!-- Contenedor principal con espaciado y color de texto claro -->
      <div class="container-fluid py-4 px-4" style="position: relative; z-index: 2; color: #ecf0f1 !important;">
        <!-- Aquí añadimos color por si hay algún reset de estilos en el router-outlet -->
        <div style="color: #ecf0f1 !important;">
          <router-outlet></router-outlet>
        </div>
      </div>
    </div>

    <app-footer class="border-top"
      style="background: #2c3e50 !important; color: #ecf0f1 !important; border-color: rgba(255,255,255,0.1) !important;"></app-footer>

    <!-- Control Sidebar -->
    <aside class="control-sidebar control-sidebar-dark" style="background: #1a252f !important;">
      <!-- Control sidebar content goes here -->
    </aside>
  </div>

  <!-- Chatbot componente -->
  <app-chatbot *ngIf="authService.isAuth()"></app-chatbot>

  <!-- Script para añadir estilos globales - última opción si lo anterior no funciona -->
  <script>
    (function () {
      // Agregar estilos globales para asegurar que se apliquen
      var style = document.createElement('style');
      style.innerHTML = `
        body, .wrapper { background-color: #2c3e50 !important; }
        .content-wrapper { background-color: #34495e !important; color: #ecf0f1 !important; }
        .card { background-color: #2c3e50 !important; color: #ecf0f1 !important; }
        .card-header { background-color: rgba(0,0,0,0.2) !important; }
        .table { color: #ecf0f1 !important; }
        .table-striped tbody tr:nth-of-type(odd) { background-color: rgba(0,0,0,0.1) !important; }
      `;
      document.head.appendChild(style);

      // También agregar la fuente Poppins
      var link = document.createElement('link');
      link.rel = 'stylesheet';
      link.href = 'https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap';
      document.head.appendChild(link);
    })();
  </script>
</body>
