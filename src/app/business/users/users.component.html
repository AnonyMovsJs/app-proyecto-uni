<div class="container">
  <table class="table table-striped table-hover table-responsive">

    <thead>
      <tr>
        <th>Id</th>
        <th>Nombre</th>
        <th>Apellido</th>
        <th>Dni</th>
        <th>Email</th>
        <th>Teléfono</th>
        <th>Dirección</th>
      </tr>
    </thead>

    <tbody>
      @for (user of users; track $index) {

        <tr>
          <td> {{user.id}} </td>
          <td> {{user.name}} </td>
          <td> {{user.lastname}} </td>
          <td> {{user.dni}} </td>
          <td> {{user.email}} </td>
          <td> {{user.phone}} </td>
          <td> {{user.address}} </td>
        </tr>
      }

    </tbody>


  </table>

</div>
