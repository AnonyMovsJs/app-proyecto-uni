<div class="container">
  <h2>Mis Compras</h2>
  <div *ngIf="loading" class="text-center">
    <div class="spinner-border" role="status"></div>
  </div>
  <div *ngIf="error" class="alert alert-danger">{{ error }}</div>
  <table *ngIf="!loading && !error" class="table table-striped">
    <thead>
      <tr>
        <!-- <th>Fecha</th> -->
        <th>Descripción</th>
        <th>Monto</th>
        <th>Tipo</th>
        <th>Estado</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let venta of ventas">
        <!-- <td>{{ venta.fecha_venta| date:'dd/MM/yyyy' }}</td> -->
        <td>{{ venta.descripcion }}</td>
        <td>S/. {{ venta.montoTotal| number:'1.2-2' }}</td>
        <td>
          <span class="badge text-bg-dark" [ngClass]="venta.tipoVenta">
            {{ venta.tipoVenta }}
          </span>
        </td>
        <td>
          <span class="badge" [ngClass]="{
               'badge-success': venta.estado === 'PAGADO',
               'badge-warning': venta.estado === 'PENDIENTE',
             'badge-danger': venta.estado === 'VENCIDO'
             }">
            {{ venta.estado }}
          </span>
        </td>
        <td>
          <a [routerLink]="['/cliente/detalle-compra', venta.id]" class="btn btn-sm btn-info">
            Ver Detalle
          </a>
        </td>
      </tr>
    </tbody>
  </table>
</div>
